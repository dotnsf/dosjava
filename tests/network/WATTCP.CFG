# Wattcp Configuration File
# Copy this file to wattcp.cfg in the same directory as your program

# Static IP configuration (REQUIRED)
my_ip = 192.168.0.123
netmask = 255.255.255.0
gateway = 192.168.0.1

# DNS server
nameserver = 8.8.8.8

# Disable DHCP/BOOTP/RARP (use static IP only)
BOOTP = 0
DHCP = 0
RARP = 0

# DOS extender mode (0 = real mode, 1 = protected mode)
DOSX = 0

# Packet driver settings
pktdrv.vector = 0x60

# Debug mode (0=off, 1=minimal, 2=verbose)
debug.mode = 2

