/*
 * dosjava Configuration File for mTCP
 * 
 * This configuration file is used by the mTCP TCP/IP library
 * for the dosjava project (DOS Java compiler and VM).
 * 
 * Based on doscurl.cfg with adjustments for Small memory model
 * and reduced memory footprint suitable for DOS Java VM.
 */

#ifndef CONFIG_H
#define CONFIG_H

#define MTCP_PROGRAM_NAME "dosjava"

/* Disable heap checking BEFORE including GLOBAL.CFG
 * This prevents false positives with malloc/free usage
 * and reduces memory overhead
 */
#define UTILS_CHECK_HEAP (0)
#define UTILS_HEAP_CHECK_LEVEL (0)

/* Include global mTCP configuration */
#include "GLOBAL.CFG"

/* Force disable heap checking AFTER including GLOBAL.CFG
 * to ensure our settings take precedence
 */
#undef UTILS_CHECK_HEAP
#define UTILS_CHECK_HEAP (0)
#undef UTILS_HEAP_CHECK_LEVEL
#define UTILS_HEAP_CHECK_LEVEL (0)

/* Local TCP/IP library options */
#define COMPILE_ARP
#define IP_FRAGMENTS_ON
#define COMPILE_UDP
#define COMPILE_TCP
#define COMPILE_DNS

/* Override defaults for dosjava
 * 
 * Memory constraints for DOS Java VM:
 * - Total DOS memory: 640KB
 * - VM code + data: ~100KB
 * - mTCP stack: ~50KB
 * - Socket buffers: ~50KB
 * - Application: ~400KB remaining
 * 
 * We use conservative settings to stay within limits
 */

/* Maximum number of concurrent TCP sockets
 * Reduced from doscurl's 4 to minimize memory usage
 */
#undef TCP_MAX_SOCKETS
#define TCP_MAX_SOCKETS (4)

/* Number of packet buffers
 * Reduced from doscurl's 20 to 10 for smaller footprint
 */
#undef PACKET_BUFFERS
#define PACKET_BUFFERS (10)

/* Application specific settings */
#define DOSJAVA_VERSION "1.0.0"
#define DOSJAVA_SOCKET_SUPPORT "mTCP"

#endif /* CONFIG_H */
